name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: syntax + asset wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - name: index.html loads the split assets
        run: |
          grep -q 'href="style.css"' index.html
          grep -q 'src="app.js"' index.html
